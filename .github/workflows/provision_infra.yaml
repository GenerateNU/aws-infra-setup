name: Provision Custom AWS Infra (users, S3, SNS, SES, etc.)

on:
  workflow_dispatch:
    inputs:
      team_name:
          description: Team name (used as prefix). NOTE- This will be added to infrastructre names. For example if you provide 
            an S3 bucket name "headshots" and team "prisere" your bucket will be named "prisere-headshots". Input "....." to override and have no team name/prefix added to resources.
          required: true
          type: string
      s3_bucket_names:
        description: List of s3-buckets to create (or update/destroy), separated by commans. Ex) 'thumbnails, headshots, test-bucket'
        required: false
        type: string
      iam_users:
        description: List of users to create (or update/destroy), separated by commas. Ex) 'stone, pebble'
        required: false
        type: string
      # to do: add sqs, sns, ses
      # possibly to do: add env param (dev, prod)
      action:
        description: 'Action to perform on infrastructre. DESTROY: WARNING action cant be reversed. APPLY: Actually perform the action. PLAN: Dry Run of what actions/outcomes will happen.'
        required: true
        type: choice
        options:
          - plan  
          - apply
          - destroy
        default:
          plan
      reviewed_plan:
        description: '*** IMPORTANT: You must run the "plan" action before "apply" or "destroy" to review the output. Confirm you have ran a "plan" job and reviewed the output before proceesing to apply/destory.'
        required: false
        type: boolean
        default: 'false'

permissions:
  # Grants the workflow permissions to request an OIDC token form Github's toen service
  id-token: write 
  contents: read # Allow workflow to read/checkout this repo
  

jobs:
  provision-infra:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Confirmation
        if: inputs.action != 'plan'
        run: |
          if [ ! "${{ inputs.reviewed_plan }}" ]; then
            echo "ERROR: Confirmation required for ${{ inputs.action }}"
            echo "To proceed with ${{ inputs.action }} make sure you have reveiwed the plan, and confirm so in the input parameter (reviewed_plan)"
            exit 1
          fi
          echo "Action confirmed: ${{ inputs.action }}"
      
      # This step authenticates with AWS using the IAM role
      # So we can get temporary AWS Creds to perform infra actions.
      # Automatically sets AWS env vars that terraform will automatically use to auth with AWS.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::478867930449:role/terraform-deployer
          aws-region: us-east-2
          # adding a role session name for better CloudTrail tracking - audit log of terraform actions
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # - name: Install Python dependencies
      #   run: |
      #     pip install boto3

      - name: Run Terraform Provisioning
        run: |
          python infra-provisioner/provisioner.py
        env:
          TEAM_NAME: ${{ inputs.team_name }}
          S3_BUCKETS: ${{ inputs.s3_bucket_names }}
          IAM_USERS: ${{ inputs.iam_users }}
          ACTION: ${{ inputs.action }}